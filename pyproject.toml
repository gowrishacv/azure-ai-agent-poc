[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azure-ai-agent-poc"
version = "0.1.0"
description = "Keyless RAG agent API for Microsoft Foundry and Azure AI Search."
requires-python = ">=3.11,<3.15"
dependencies = [
  "aiohttp>=3.11,<4",
  "azure-identity>=1.21,<2",
  "azure-monitor-opentelemetry>=1.6,<2",
  "azure-search-documents>=11.6,<12",
  "fastapi>=0.115,<1",
  "openai>=1.75,<3",
  "pydantic-settings>=2.8,<3",
  "pyjwt[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
