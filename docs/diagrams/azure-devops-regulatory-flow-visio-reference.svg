<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 34px "Segoe UI",Arial,sans-serif;fill:#172033}
      .subtitle{font:400 17px "Segoe UI",Arial,sans-serif;fill:#5c667a}
      .lane{font:700 17px "Segoe UI",Arial,sans-serif;fill:#26344d}
      .node-title{font:700 16px "Segoe UI",Arial,sans-serif;fill:#172033;text-anchor:middle}
      .node-sub{font:400 12px "Segoe UI",Arial,sans-serif;fill:#5c667a;text-anchor:middle}
      .badge{font:700 15px "Segoe UI",Arial,sans-serif;fill:#fff;text-anchor:middle}
      .label{font:600 12px "Segoe UI",Arial,sans-serif;fill:#526078}
      .card{fill:#fff;stroke:#d7e0ea;stroke-width:1.5;rx:13;filter:url(#shadow)}
      .line{fill:none;stroke:#1877bd;stroke-width:2.5;marker-end:url(#arrow)}
      .human{fill:none;stroke:#7b61a8;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrowPurple)}
      .fail{fill:none;stroke:#c63b3b;stroke-width:2.5;marker-end:url(#arrowRed)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172033" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1877bd"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7b61a8"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c63b3b"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="60" y="62" class="title">Azure DevOps GDPR/DORA regulatory-evidence flow</text>
  <text x="60" y="92" class="subtitle">Deterministic deployment gate with sanitized, advisory Microsoft Foundry review</text>

  <rect x="45" y="125" width="1510" height="260" rx="18" fill="#edf6fc" stroke="#bddcf1"/>
  <text x="70" y="158" class="lane">Automated delivery lane</text>

  <g id="validate">
    <rect x="75" y="195" width="180" height="105" class="card"/>
    <circle cx="165" cy="227" r="21" fill="#0078d4"/>
    <text x="165" y="232" class="badge">1</text>
    <text x="165" y="265" class="node-title">Validate</text>
    <text x="165" y="285" class="node-sub">Tests + Terraform</text>
  </g>
  <g id="plan">
    <rect x="300" y="195" width="180" height="105" class="card"/>
    <circle cx="390" cy="227" r="21" fill="#0078d4"/>
    <text x="390" y="232" class="badge">2</text>
    <text x="390" y="265" class="node-title">Terraform plan</text>
    <text x="390" y="285" class="node-sub">Immutable artifact</text>
  </g>
  <g id="approval">
    <rect x="525" y="195" width="180" height="105" class="card"/>
    <circle cx="615" cy="227" r="21" fill="#7b61a8"/>
    <text x="615" y="232" class="badge">3</text>
    <text x="615" y="265" class="node-title">Approval</text>
    <text x="615" y="285" class="node-sub">Environment check</text>
  </g>
  <g id="apply">
    <rect x="750" y="195" width="180" height="105" class="card"/>
    <circle cx="840" cy="227" r="21" fill="#0078d4"/>
    <text x="840" y="232" class="badge">4</text>
    <text x="840" y="265" class="node-title">Terraform apply</text>
    <text x="840" y="285" class="node-sub">Azure infrastructure</text>
  </g>
  <g id="deterministic">
    <rect x="975" y="180" width="230" height="135" class="card"/>
    <circle cx="1090" cy="217" r="23" fill="#5b8c5a"/>
    <text x="1090" y="223" class="badge">5</text>
    <text x="1090" y="258" class="node-title">Deterministic controls</text>
    <text x="1090" y="279" class="node-sub">GDPR 25 / 32 / 35</text>
    <text x="1090" y="299" class="node-sub">DORA 9 / 10 / 11</text>
  </g>
  <g id="decision">
    <polygon points="1335,180 1435,248 1335,316 1235,248" fill="#fff" stroke="#5b8c5a" stroke-width="2" filter="url(#shadow)"/>
    <text x="1335" y="242" class="node-title">Critical</text>
    <text x="1335" y="263" class="node-title">failure?</text>
  </g>
  <path d="M255 248 H290" class="line"/>
  <path d="M480 248 H515" class="line"/>
  <path d="M705 248 H740" class="line"/>
  <path d="M930 248 H965" class="line"/>
  <path d="M1205 248 H1225" class="line"/>

  <rect x="45" y="420" width="1510" height="220" rx="18" fill="#f4f0fa" stroke="#dacced"/>
  <text x="70" y="454" class="lane">Advisory review and evidence lane</text>

  <g id="sanitized-results">
    <rect x="190" y="495" width="220" height="105" class="card"/>
    <circle cx="300" cy="527" r="21" fill="#3b8f6a"/>
    <text x="300" y="532" class="badge">OK</text>
    <text x="300" y="565" class="node-title">Sanitized results</text>
    <text x="300" y="585" class="node-sub">No code, state, or secrets</text>
  </g>
  <g id="foundry-review">
    <rect x="505" y="480" width="240" height="135" class="card"/>
    <circle cx="625" cy="517" r="23" fill="#6347a5"/>
    <text x="625" y="523" class="badge">AI</text>
    <text x="625" y="558" class="node-title">Microsoft Foundry</text>
    <text x="625" y="579" class="node-sub">Advisory gap analysis</text>
    <text x="625" y="599" class="node-sub">Cannot certify compliance</text>
  </g>
  <g id="artifacts">
    <rect x="840" y="480" width="240" height="135" class="card"/>
    <circle cx="960" cy="517" r="23" fill="#3b8f6a"/>
    <text x="960" y="523" class="badge">EV</text>
    <text x="960" y="558" class="node-title">Evidence artifact</text>
    <text x="960" y="579" class="node-sub">Markdown + JSON</text>
    <text x="960" y="599" class="node-sub">SHA-256 manifest</text>
  </g>
  <g id="deploy">
    <rect x="1175" y="480" width="240" height="135" class="card"/>
    <circle cx="1295" cy="517" r="23" fill="#0078d4"/>
    <text x="1295" y="523" class="badge">6</text>
    <text x="1295" y="558" class="node-title">Build and deploy</text>
    <text x="1295" y="579" class="node-sub">Image + index + smoke test</text>
    <text x="1295" y="599" class="node-sub">Only after gate passes</text>
  </g>
  <path d="M1335 316 V350 H300 V485" class="line"/>
  <text x="1350" y="342" class="label">No</text>
  <path d="M410 548 H495" class="line"/>
  <path d="M745 548 H830" class="line"/>
  <path d="M1080 548 H1165" class="line"/>

  <g id="blocked">
    <rect x="1260" y="350" width="210" height="58" rx="12" fill="#fff1f1" stroke="#d86b6b" stroke-width="1.5"/>
    <text x="1365" y="374" class="node-title" fill="#a52f2f">Block deployment</text>
    <text x="1365" y="395" class="node-sub">Publish failure evidence</text>
  </g>
  <path d="M1435 248 H1490 V379 H1480" class="fail"/>
  <text x="1450" y="236" class="label" fill="#a52f2f">Yes</text>

  <rect x="45" y="680" width="1510" height="150" rx="18" fill="#fff" stroke="#d7e0ea"/>
  <text x="70" y="714" class="lane">Human accountability lane</text>
  <g id="dpia">
    <rect x="170" y="742" width="260" height="62" rx="12" fill="#f4f0fa" stroke="#cdbbe5"/>
    <text x="300" y="768" class="node-title">GDPR DPIA decision</text>
    <text x="300" y="790" class="node-sub">Controller / DPO / legal owner</text>
  </g>
  <g id="dora-scope">
    <rect x="545" y="742" width="280" height="62" rx="12" fill="#f4f0fa" stroke="#cdbbe5"/>
    <text x="685" y="768" class="node-title">DORA applicability decision</text>
    <text x="685" y="790" class="node-sub">Financial-sector business owner</text>
  </g>
  <g id="risk">
    <rect x="940" y="742" width="280" height="62" rx="12" fill="#f4f0fa" stroke="#cdbbe5"/>
    <text x="1080" y="768" class="node-title">Risk acceptance / remediation</text>
    <text x="1080" y="790" class="node-sub">Named approver + review date</text>
  </g>
  <path d="M300 742 V630 H900" class="human"/>
  <path d="M685 742 V650 H940 V625" class="human"/>
  <path d="M1080 742 V625" class="human"/>

  <text x="60" y="866" class="node-sub" text-anchor="start">Blue = automated delivery  •  Red = blocking path  •  Purple dashed = mandatory human decision</text>
</svg>
